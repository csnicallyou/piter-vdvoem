name: Geocode places from OpenStreetMap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geocode_places.py'
permissions:
  contents: write
concurrency:
  group: places-geocoding
  cancel-in-progress: false
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Geocode only confident place matches
        run: python3 scripts/geocode_places.py
      - name: Commit verified candidate coordinates and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html geocoding-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Populate places map with OSM geocoding candidates"
            git push
          fi
